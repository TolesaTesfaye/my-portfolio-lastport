<!DOCTYPE html>
<html>
<head>
    <title>Deployment Version Checker</title>
    <style>
        body { font-family: system-ui; max-width: 800px; margin: 50px auto; padding: 20px; }
        .result { background: #f0f0f0; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { background: #0070f3; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0051cc; }
        h1 { color: #333; }
        code { background: #e0e0e0; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🔍 Deployment Version Checker</h1>
    <p>Enter your deployed site URLs to check what's actually live:</p>
    
    <label>Your Vercel URL:</label><br>
    <input type="text" id="prodUrl" value="https://my-portfolio-lastport.vercel.app" style="width: 100%; padding: 8px; margin: 10px 0;">
    
    <br><br>
    <button onclick="checkDeployment()">Check What's Deployed</button>
    
    <div id="result"></div>

    <script>
        async function checkDeployment() {
            const url = document.getElementById('prodUrl').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Checking deployment...</div>';
            
            try {
                const response = await fetch(url);
                const html = await response.text();
                
                // Check for version markers
                const hasGalleryV2 = html.includes('Enhanced Image Gallery v2.1');
                const hasOldVersion = html.includes('v1.0') && !hasGalleryV2;
                
                let result = '<div class="result">';
                result += `<h3>Deployment Status:</h3>`;
                result += `<p><strong>URL:</strong> <code>${url}</code></p>`;
                result += `<p><strong>Response Time:</strong> ${new Date().toLocaleTimeString()}</p>`;
                result += `<p><strong>Status Code:</strong> ${response.status}</p>`;
                
                if (hasGalleryV2) {
                    result += `<p class="success" style="padding: 10px; margin-top: 10px;"><strong>✅ DEPLOYED:</strong> Latest version (v2.1) is live!</p>`;
                } else if (hasOldVersion) {
                    result += `<p class="error" style="padding: 10px; margin-top: 10px;"><strong>❌ OLD VERSION:</strong> Still showing v1.0</p>`;
                } else {
                    result += `<p style="padding: 10px; margin-top: 10px; background: #fff3cd;"><strong>⚠️ UNKNOWN:</strong> Cannot detect version</p>`;
                }
                
                result += `<br><p><strong>💡 Tip:</strong> If showing old version, try:</p>`;
                result += `<ul>`;
                result += `<li>Open in Incognito mode: <strong>Ctrl + Shift + N</strong></li>`;
                result += `<li>Hard refresh: <strong>Ctrl + Shift + R</strong></li>`;
                result += `<li>Clear browser cache completely</li>`;
                result += `</ul>`;
                result += '</div>';
                
                resultDiv.innerHTML = result;
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
